# Seal before committing. Run this when Sealed Secrets controller is installed (Phase 2).
#
# kubectl create secret generic vimsfinance-backend-secrets \
#   --from-literal=DB_PASSWORD=<from docker inspect vimsfinance-postgres POSTGRES_PASSWORD> \
#   --from-literal=REDIS_PASSWORD=<from docker inspect vimsfinance-backend REDIS_PASSWORD> \
#   --from-literal=MAIL_PASSWORD=<from docker inspect vimsfinance-backend MAIL_PASSWORD> \
#   --from-literal=JWT_SECRET=<from docker inspect vimsfinance-backend JWT_SECRET> \
#   --from-literal=CASPARSER_INTERNAL_TOKEN=<from docker inspect vimsfinance-backend CASPARSER_INTERNAL_TOKEN> \
#   --from-literal=ALPHA_VANTAGE_API_KEY=<from docker inspect vimsfinance-backend ALPHA_VANTAGE_API_KEY> \
#   --namespace applications --dry-run=client -o yaml \
#   | kubeseal --format yaml > sealed-secret.yaml
#
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: vimsfinance-backend-secrets
  namespace: applications
spec:
  encryptedData:
    DB_PASSWORD: REPLACE_WITH_SEALED_VALUE
    REDIS_PASSWORD: REPLACE_WITH_SEALED_VALUE
    MAIL_PASSWORD: REPLACE_WITH_SEALED_VALUE
    JWT_SECRET: REPLACE_WITH_SEALED_VALUE
    CASPARSER_INTERNAL_TOKEN: REPLACE_WITH_SEALED_VALUE
    ALPHA_VANTAGE_API_KEY: REPLACE_WITH_SEALED_VALUE
  template:
    metadata:
      name: vimsfinance-backend-secrets
      namespace: applications
