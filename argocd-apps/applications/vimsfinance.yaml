apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vimsfinance
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/vimleshkpandey/platform-gitops
      targetRevision: HEAD
      path: charts/springboot-app
      helm:
        releaseName: vimsfinance
        valueFiles:
          - $appvalues/applications/vimsfinance/values.yaml
    - repoURL: https://github.com/vimleshkpandey/platform-gitops
      targetRevision: HEAD
      ref: appvalues
  destination:
    server: https://kubernetes.default.svc
    namespace: applications
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
