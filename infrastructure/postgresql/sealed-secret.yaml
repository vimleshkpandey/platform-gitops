# Seal this before committing to Git.
#
# Steps:
#   1. kubectl create secret generic postgresql-credentials \
#        --from-literal=postgres-password=CHANGE_ME \
#        --from-literal=password=CHANGE_ME \
#        --namespace databases --dry-run=client -o yaml \
#      | kubeseal --format yaml > sealed-secret.yaml
#
#   2. Replace the contents below with the output from step 1.
#   3. Commit sealed-secret.yaml — it is safe to store in Git.
#
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postgresql-credentials
  namespace: databases
spec:
  encryptedData:
    postgres-password: REPLACE_WITH_SEALED_VALUE
    password: REPLACE_WITH_SEALED_VALUE
  template:
    metadata:
      name: postgresql-credentials
      namespace: databases
