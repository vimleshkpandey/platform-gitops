traefik:
  deployment:
    replicas: 1
    kind: DaemonSet

  # hostNetwork: true binds Traefik directly to the node's network namespace
  # Required because Cilium CNI has no portmap plugin, so hostPort does not work
  # DaemonSet ensures one Traefik per node (correct for single-node and future multi-node)
  hostNetwork: true

  service:
    type: ClusterIP

  ports:
    web:
      port: 80
      redirectTo:
        port: websecure
        scheme: https
    websecure:
      port: 443
    metrics:
      port: 9100
      expose:
        default: true

  ingressRoute:
    dashboard:
      enabled: true
      entryPoints:
        - websecure
      middlewares:
        - name: traefik-dashboard-auth

  providers:
    kubernetesCRD:
      enabled: true
      allowCrossNamespace: true
    kubernetesIngress:
      enabled: true
      publishedService:
        enabled: true

  metrics:
    prometheus:
      enabled: true
      entryPoint: metrics
      addEntryPointsLabels: true
      addServicesLabels: true
      serviceMonitor:
        enabled: true
        namespace: ingress

  logs:
    general:
      level: INFO
    access:
      enabled: true

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
