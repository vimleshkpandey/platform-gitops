traefik:
  deployment:
    replicas: 1

  service:
    type: LoadBalancer

  # hostPort binds Traefik directly to the node's NIC on ports 80/443
  # Required because servicelb is disabled and no cloud LoadBalancer exists
  hostNetwork: false
  ports:
    web:
      port: 80
      hostPort: 80
      redirectTo:
        port: websecure
        scheme: https
    websecure:
      port: 443
      hostPort: 443
    metrics:
      port: 9100
      expose:
        default: true

  ingressRoute:
    dashboard:
      enabled: true
      entryPoints:
        - websecure
      middlewares:
        - name: traefik-dashboard-auth

  providers:
    kubernetesCRD:
      enabled: true
      allowCrossNamespace: true
    kubernetesIngress:
      enabled: true
      publishedService:
        enabled: true

  metrics:
    prometheus:
      enabled: true
      entryPoint: metrics
      addEntryPointsLabels: true
      addServicesLabels: true
      serviceMonitor:
        enabled: true
        namespace: ingress

  logs:
    general:
      level: INFO
    access:
      enabled: true

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
