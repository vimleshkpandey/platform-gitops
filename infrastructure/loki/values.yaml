loki:
  auth_enabled: false

  deploymentMode: SingleBinary

  singleBinary:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    storage:
      type: filesystem

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  persistence:
    enabled: true
    storageClassName: local-path
    size: 10Gi

  gateway:
    enabled: false

  monitoring:
    selfMonitoring:
      enabled: false
    serviceMonitor:
      enabled: true

promtail:
  config:
    logLevel: info
    serverPort: 3101
    clients:
      - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  serviceMonitor:
    enabled: true
